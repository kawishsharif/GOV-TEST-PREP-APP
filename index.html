<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5675">
  <meta name="description" content="Learn & Lead — exam preparation for Pakistani government recruitment tests, starting with WAPDA AEE (Electrical) BPS-17.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Learn & Lead">
  <title>Learn & Lead</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Apply the saved theme before the first paint (no light flash in dark mode).
    try {
      var t = (JSON.parse(localStorage.getItem('learnlead:v1:global') || '{}') || {}).theme;
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>Learn &amp; Lead needs JavaScript enabled.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
